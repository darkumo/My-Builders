          cat > $J/Notifier.java <<'EOF'
          package com.dark.constructores;
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          import org.json.JSONArray;
          import org.json.JSONObject;
          // Upgrade-finished notifications. Uses the same rows the app sends to the widget; one alarm for the next finish at a time.
          public class Notifier extends BroadcastReceiver {
            static final String FIRE = "com.dark.constructores.NOTIFY";
            static SharedPreferences p(Context c) { return c.getSharedPreferences("notif", Context.MODE_PRIVATE); }
            static JSONObject cfg(Context c) { try { return new JSONObject(p(c).getString("cfg", "{}")); } catch (Exception x) { return new JSONObject(); } }
            static boolean wants(JSONObject cfg, String g) { return cfg.optBoolean("on", false) && cfg.optBoolean(g, true); }
            static void setConfig(Context c, String json) { p(c).edit().putString("cfg", json).apply(); schedule(c); }
            // new data from the app: anything already finished was seen there, so don't announce it
            static void dataChanged(Context c) {
              long now = System.currentTimeMillis();
              if (p(c).getLong("last", 0) < now) p(c).edit().putLong("last", now).apply();
              schedule(c);
            }
            @Override public void onReceive(Context c, Intent i) { if (FIRE.equals(i.getAction())) { fire(c); schedule(c); } }
            static PendingIntent alarm(Context c) {
              Intent i = new Intent(c, Notifier.class).setAction(FIRE);
              return PendingIntent.getBroadcast(c, 10, i, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
            }
            static void schedule(Context c) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              if (am == null) return;
              PendingIntent pi = alarm(c);
              am.cancel(pi);
              JSONObject cfg = cfg(c);
              if (!cfg.optBoolean("on", false)) return;
              long now = System.currentTimeMillis(), last = p(c).getLong("last", now), next = Long.MAX_VALUE;
              JSONArray vs = Widget.data(c).optJSONArray("v");
              if (vs != null) for (int a = 0; a < vs.length(); a++) {
                JSONObject vo = vs.optJSONObject(a);
                JSONArray rows = vo == null ? null : vo.optJSONArray("rows");
                if (rows != null) for (int k = 0; k < rows.length(); k++) {
                  JSONObject r = rows.optJSONObject(k);
                  if (r == null || !wants(cfg, r.optString("g", "b"))) continue;
                  long e = r.optLong("e");
                  if (e > Math.max(now, last)) next = Math.min(next, e);
                }
              }
              if (next == Long.MAX_VALUE) return;
              if (Build.VERSION.SDK_INT >= 31 && !am.canScheduleExactAlarms()) am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next, pi);
              else am.setExactAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, next, pi);
            }
            static void fire(Context c) {
              long now = System.currentTimeMillis() + 30000, last = p(c).getLong("last", 0);
              JSONObject cfg = cfg(c), d = Widget.data(c);
              boolean es = d.optBoolean("es", true);
              NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
              if (nm == null) return;
              if (Build.VERSION.SDK_INT >= 26) {
                NotificationChannel ch = new NotificationChannel("done", es ? "Mejoras terminadas" : "Finished upgrades", NotificationManager.IMPORTANCE_DEFAULT);
                nm.createNotificationChannel(ch);
              }
              JSONArray vs = d.optJSONArray("v");
              int many = vs == null ? 0 : vs.length();
              if (vs != null) for (int a = 0; a < vs.length(); a++) {
                JSONObject vo = vs.optJSONObject(a);
                JSONArray rows = vo == null ? null : vo.optJSONArray("rows");
                if (rows != null) for (int k = 0; k < rows.length(); k++) {
                  JSONObject r = rows.optJSONObject(k);
                  if (r == null || !wants(cfg, r.optString("g", "b"))) continue;
                  long e = r.optLong("e");
                  if (e <= last || e > now) continue;
                  String g = r.optString("g", "b");
                  String title = "l".equals(g) ? (es ? "Investigación terminada" : "Research finished")
                    : "p".equals(g) ? (es ? "Mascota mejorada" : "Pet upgraded")
                    : "bb".equals(g) ? (es ? "Aldea nocturna: mejora terminada" : "Builder Base: upgrade finished")
                    : (es ? "Mejora terminada" : "Upgrade finished");
                  String text = r.optString("n") + (r.has("lv") ? " → " + r.optInt("lv") : "");
                  Intent oi = new Intent(c, MainActivity.class).setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                  PendingIntent open = PendingIntent.getActivity(c, 1, oi, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, "done") : new Notification.Builder(c);
                  b.setSmallIcon(R.drawable.ic_stat).setContentTitle(title).setContentText(text).setAutoCancel(true).setContentIntent(open).setWhen(e).setShowWhen(true);
                  if (many > 1) b.setSubText(vo.optString("name"));
                  try { nm.notify((vo.optString("k") + r.optString("n") + e).hashCode(), b.build()); } catch (Exception x) { }
                }
              }
              p(c).edit().putLong("last", now).apply();
            }
          }
          EOF
          cat > $J/Boot.java <<'EOF'
          package com.dark.constructores;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          // alarms are cleared on reboot: set them again
          public class Boot extends BroadcastReceiver {
            @Override public void onReceive(Context c, Intent i) {
              if (Intent.ACTION_BOOT_COMPLETED.equals(i.getAction())) { Notifier.schedule(c); Widget.updateAll(c); }
            }
          }
