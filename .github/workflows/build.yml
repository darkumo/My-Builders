name: Construir APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Crear proyecto Android
        run: |
          P=app/src/main
          J=$P/java/com/dark/constructores
          mkdir -p $P/assets $J $P/res/drawable $P/res/layout $P/res/xml $P/res/values
          cp index.html $P/assets/index.html
          # the app learns its own repo name, so update checks work whatever the repo is called
          echo "$GITHUB_REPOSITORY" > $P/assets/repo.txt
          cat > settings.gradle <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "MisConstructores"
          include ':app'
          EOF
          echo "plugins { id 'com.android.application' version '8.7.3' apply false }" > build.gradle
          echo "android.useAndroidX=true" > gradle.properties
          cat > app/build.gradle <<'EOF'
          plugins { id 'com.android.application' }
          def appVer = (rootProject.file('index.html').text =~ /APP_VERSION='([^']+)'/)[0][1]
          android {
            namespace 'com.dark.constructores'
            compileSdk 35
            defaultConfig {
              applicationId "com.dark.constructores"
              minSdk 24
              targetSdk 35
              versionCode((System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int)
              versionName appVer
            }
            signingConfigs {
              debug {
                storeFile rootProject.file('debug.keystore')
                storePassword 'android'
                keyAlias 'androiddebugkey'
                keyPassword 'android'
              }
            }
            lint { abortOnError false; checkReleaseBuilds false }
          }
          EOF
          cat > $P/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.USE_EXACT_ALARM"/>
            <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM" android:maxSdkVersion="32"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <application android:label="My Builders" android:icon="@mipmap/ic"
                android:theme="@android:style/Theme.Material.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true" android:launchMode="singleTask"
                  android:configChanges="orientation|screenSize|keyboardHidden|uiMode"
                  android:windowSoftInputMode="adjustNothing">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <activity android:name=".WidgetConfig" android:exported="true" android:excludeFromRecents="true"
                  android:theme="@android:style/Theme.DeviceDefault.Dialog.NoActionBar">
                <intent-filter><action android:name="android.appwidget.action.APPWIDGET_CONFIGURE"/></intent-filter>
              </activity>
              <receiver android:name=".Notifier" android:exported="false"/>
              <receiver android:name=".Boot" android:exported="true">
                <intent-filter><action android:name="android.intent.action.BOOT_COMPLETED"/></intent-filter>
              </receiver>
              <receiver android:name=".Widget" android:exported="true" android:label="My Builders">
                <intent-filter><action android:name="android.appwidget.action.APPWIDGET_UPDATE"/></intent-filter>
                <meta-data android:name="android.appwidget.provider" android:resource="@xml/widget_info"/>
              </receiver>
            </application>
          </manifest>
          EOF
          # app icon: Supercell fan-kit hammer on the game's yellow button (adaptive layers + a plain one for old Android)
          mkdir -p $P/res/drawable-nodpi $P/res/mipmap-xxxhdpi $P/res/mipmap-anydpi-v26
