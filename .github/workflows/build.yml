          package com.dark.constructores;
          import android.app.AlarmManager;
          import android.app.PendingIntent;
          import android.appwidget.AppWidgetManager;
          import android.appwidget.AppWidgetProvider;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.Bitmap;
          import android.graphics.Canvas;
          import android.graphics.Paint;
          import android.graphics.RectF;
          import android.os.Bundle;
          import android.os.SystemClock;
          import android.view.View;
          import android.widget.RemoteViews;
          import org.json.JSONArray;
          import org.json.JSONObject;
          // Home-screen widget: the app sends every village's rows (name, finish time, progress); each widget shows one village
          public class Widget extends AppWidgetProvider {
            static final String REFRESH = "com.dark.constructores.REFRESH";
            static final int N = 10;
            static final int[] ICO = {R.id.m0,R.id.m1,R.id.m2,R.id.m3,R.id.m4,R.id.m5,R.id.m6,R.id.m7,R.id.m8,R.id.m9};
            static final int[] ROW = {R.id.r0,R.id.r1,R.id.r2,R.id.r3,R.id.r4,R.id.r5,R.id.r6,R.id.r7,R.id.r8,R.id.r9}, NAME = {R.id.n0,R.id.n1,R.id.n2,R.id.n3,R.id.n4,R.id.n5,R.id.n6,R.id.n7,R.id.n8,R.id.n9}, TM = {R.id.t0,R.id.t1,R.id.t2,R.id.t3,R.id.t4,R.id.t5,R.id.t6,R.id.t7,R.id.t8,R.id.t9}, CH = {R.id.c0,R.id.c1,R.id.c2,R.id.c3,R.id.c4,R.id.c5,R.id.c6,R.id.c7,R.id.c8,R.id.c9}, BAR = {R.id.b0,R.id.b1,R.id.b2,R.id.b3,R.id.b4,R.id.b5,R.id.b6,R.id.b7,R.id.b8,R.id.b9};
            // background, text, bar track, bar, done bar, builder base bar, Sync pill, Sync text
            static final int[] CLASSIC = {R.drawable.wbg_classic, 0xFFFFF7E6, 0xFF2A1B0F, 0xFF7CC83A, 0xFFF5B623, 0xFF4A5FC4, R.drawable.wpill_classic, 0xFFFFF7E6};
            static final int[] OLED = {R.drawable.wbg_oled, 0xFFF2F2F2, 0xFF1C1C1C, 0xFF4ADE80, 0xFFFACC15, 0xFF5B6FE0, R.drawable.wpill_oled, 0xFFF2F2F2};
            static final int[] LIGHT = {R.drawable.wbg_light, 0xFF161616, 0xFFE9E9E6, 0xFF16A34A, 0xFFEAB308, 0xFF31428F, R.drawable.wpill_light, 0xFF161616};
            static SharedPreferences p(Context c) { return c.getSharedPreferences("widget", Context.MODE_PRIVATE); }
            static JSONObject data(Context c) { try { return new JSONObject(p(c).getString("data", "{}")); } catch (Exception x) { return new JSONObject(); } }
            static boolean es(Context c) { return data(c).optBoolean("es", true); }
            static String theme(Context c) { return p(c).getString("theme", "classic"); }
            static String theme(Context c, int wid) { return p(c).getString("t_" + wid, theme(c)); }
            static String village(Context c, int wid) { return p(c).getString("v_" + wid, ""); }
            static boolean icons(Context c, int wid) { return p(c).getBoolean("i_" + wid, p(c).getBoolean("icons", false)); }
            // from the app: icons on or off for every widget
            static void setIcons(Context c, boolean on) {
              SharedPreferences.Editor e = p(c).edit().putBoolean("icons", on);
              for (int wid : ids(c)) e.putBoolean("i_" + wid, on);
              e.apply(); updateAll(c);
            }
            static android.graphics.Bitmap icon(JSONObject ic, String key) {
              try {
                String u = ic.optString(key, "");
                if (u.isEmpty()) return null;
                byte[] b = android.util.Base64.decode(u.substring(u.indexOf(',') + 1), android.util.Base64.DEFAULT);
                return android.graphics.BitmapFactory.decodeByteArray(b, 0, b.length);
              } catch (Exception x) { return null; }
            }
            static void save(Context c, String json) { p(c).edit().putString("data", json).apply(); updateAll(c); Notifier.dataChanged(c); }
            // from the app: one theme for every widget
            static void setTheme(Context c, String t) {
              SharedPreferences.Editor e = p(c).edit().putString("theme", t);
              for (int wid : ids(c)) e.putString("t_" + wid, t);
              e.apply(); updateAll(c);
            }
            // from a widget's Edit screen: just that widget
            static void setOne(Context c, int wid, String t, String v, boolean ic) {
              p(c).edit().putString("t_" + wid, t).putString("v_" + wid, v).putBoolean("i_" + wid, ic).apply();
              draw(c, AppWidgetManager.getInstance(c), wid);
              schedule(c, true);
            }
            static int[] ids(Context c) { return AppWidgetManager.getInstance(c).getAppWidgetIds(new ComponentName(c, Widget.class)); }
            static void updateAll(Context c) {
              AppWidgetManager m = AppWidgetManager.getInstance(c);
              int[] all = ids(c);
              for (int wid : all) draw(c, m, wid);
              schedule(c, all.length > 0);
            }
            @Override public void onUpdate(Context c, AppWidgetManager m, int[] wids) { updateAll(c); }
            @Override public void onAppWidgetOptionsChanged(Context c, AppWidgetManager m, int wid, Bundle o) { draw(c, m, wid); }
            @Override public void onDeleted(Context c, int[] wids) {
              SharedPreferences.Editor e = p(c).edit();
              for (int wid : wids) { e.remove("t_" + wid); e.remove("v_" + wid); e.remove("i_" + wid); }
              e.apply();
            }
            @Override public void onDisabled(Context c) { schedule(c, false); }
            @Override public void onReceive(Context c, Intent i) {
              super.onReceive(c, i);
              if (REFRESH.equals(i.getAction())) updateAll(c);
            }
            // the chosen village's rows; if it was removed from the app, the app's current one
            static JSONArray rowsFor(JSONObject d, String key) {
              JSONArray vs = d.optJSONArray("v");
              if (vs == null) return null;
              String cur = d.optString("cur");
              JSONArray fallback = null;
              for (int i = 0; i < vs.length(); i++) {
                JSONObject o = vs.optJSONObject(i);
                if (o == null) continue;
                if (o.optString("k").equals(key)) return o.optJSONArray("rows");
                if (fallback == null || o.optString("k").equals(cur)) fallback = o.optJSONArray("rows");
              }
              return fallback;
            }
            static String fmt(long left) {
              if (left >= 86400000L) return (left / 86400000L) + "d " + (left % 86400000L / 3600000L) + "h";
              long m = (left + 59999) / 60000;
              return m >= 60 ? (m / 60) + "h " + String.format("%02d", m % 60) + "m" : m + "m";
            }
            static Bitmap bar(int w, int h, double pct, int track, int fill) {
              Bitmap bm = Bitmap.createBitmap(w, h, Bitmap.Config.ARGB_8888);
              Canvas cv = new Canvas(bm);
              Paint pa = new Paint(Paint.ANTI_ALIAS_FLAG);
              float rr = h / 2f;
              pa.setColor(track); cv.drawRoundRect(new RectF(0, 0, w, h), rr, rr, pa);
              pa.setColor(fill); cv.drawRoundRect(new RectF(0, 0, Math.max(h, (float) (w * pct)), h), rr, rr, pa);
              return bm;
            }
            static void draw(Context c, AppWidgetManager m, int wid) {
              String th = theme(c, wid);
              int[] k = "oled".equals(th) ? OLED : "light".equals(th) ? LIGHT : CLASSIC;
              RemoteViews v = new RemoteViews(c.getPackageName(), R.layout.widget);
              v.setInt(R.id.root, "setBackgroundResource", k[0]);
              v.setInt(R.id.sync, "setBackgroundResource", k[6]);
              v.setTextColor(R.id.sync, k[7]);
              v.setTextColor(R.id.more, k[1]);
              v.setTextColor(R.id.empty, k[1]);
              float d = c.getResources().getDisplayMetrics().density;
              Bundle o = m.getAppWidgetOptions(wid);
              int wDp = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MIN_WIDTH, 250), hDp = o.getInt(AppWidgetManager.OPTION_APPWIDGET_MAX_HEIGHT, 160);
              if (wDp <= 0) wDp = 250;
              if (hDp <= 0) hDp = 160;
              // as many rows as fit in the size the widget was given
              int fit = Math.max(1, Math.min(N, (hDp - 22 - 24) / 31));
              JSONObject dj = data(c);
              boolean es = dj.optBoolean("es", true);
              JSONArray rows = rowsFor(dj, village(c, wid));
              boolean showIc = icons(c, wid);
              JSONObject icd = dj.optJSONObject("ic");
              java.util.HashMap<String, android.graphics.Bitmap> cache = new java.util.HashMap<>();
              int n = rows == null ? 0 : rows.length(), shown = Math.min(n, fit);
              v.setViewVisibility(R.id.empty, n == 0 ? View.VISIBLE : View.GONE);
              v.setTextViewText(R.id.empty, es ? "Abre My Builders y pega tu exportación" : "Open My Builders and paste your export");
              long now = System.currentTimeMillis();
              int bw = Math.max(40, (int) ((wDp - 24) * d)), bh = Math.max(3, (int) (4 * d));
              for (int i = 0; i < N; i++) {
                JSONObject r = i < shown ? rows.optJSONObject(i) : null;
                if (r == null) { v.setViewVisibility(ROW[i], View.GONE); continue; }
                v.setViewVisibility(ROW[i], View.VISIBLE);
                long end = r.optLong("e"), at = r.optLong("at", now), left = end - now;
                double rem = r.optDouble("r", 0), tot = Math.max(1, r.optDouble("t", 1));
                boolean bb = r.optBoolean("bb"), done = left <= 0;
                v.setTextViewText(NAME[i], r.optString("n"));
                android.graphics.Bitmap bmp = null;
                if (showIc && icd != null) { String ik = r.optString("ik", ""); if (!cache.containsKey(ik)) cache.put(ik, icon(icd, ik)); bmp = cache.get(ik); }
                if (bmp != null) { v.setImageViewBitmap(ICO[i], bmp); v.setViewVisibility(ICO[i], View.VISIBLE); } else v.setViewVisibility(ICO[i], View.GONE);
                v.setTextColor(NAME[i], k[1]);
                v.setTextColor(TM[i], k[1]);
                v.setTextColor(CH[i], k[1]);
                // HyperOS's launcher freezes live counters in widgets, so the widget redraws itself:
                // "2d 4h" every hour, "5h 08m" / "42m" every minute
                v.setViewVisibility(CH[i], View.GONE);
                v.setViewVisibility(TM[i], View.VISIBLE);
                v.setTextViewText(TM[i], done ? (es ? "¡Listo!" : "Done!") : fmt(left));
                double p0 = Math.max(0, Math.min(1, 1 - rem / tot));
                double pct = done ? 1 : end > at ? p0 + (1 - p0) * Math.max(0, Math.min(1, (double) (now - at) / (end - at))) : p0;
                v.setImageViewBitmap(BAR[i], bar(bw, bh, Math.max(0.03, pct), k[2], done ? k[4] : bb ? k[5] : k[3]));
              }
              v.setTextViewText(R.id.more, n > shown ? "+" + (n - shown) + (es ? " más" : " more") : "");
              Intent oi = new Intent(c, MainActivity.class);
              oi.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              v.setOnClickPendingIntent(R.id.root, PendingIntent.getActivity(c, 1, oi, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
              Intent si = new Intent(c, MainActivity.class).setAction(MainActivity.SYNC);
              si.setFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
              v.setOnClickPendingIntent(R.id.sync, PendingIntent.getActivity(c, 2, si, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE));
              m.updateAppWidget(wid, v);
            }
            // redraw when a shown time changes (each minute under a day, each hour above), at least every 30 min (never wakes the phone)
            static void schedule(Context c, boolean on) {
              AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
              Intent ri = new Intent(c, Widget.class).setAction(REFRESH);
              PendingIntent pi = PendingIntent.getBroadcast(c, 3, ri, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
              if (am == null) return;
              am.cancel(pi);
              if (!on) return;
              long now = System.currentTimeMillis(), next = now + 30 * 60000L;
              JSONArray vs = data(c).optJSONArray("v");
              if (vs != null) for (int a = 0; a < vs.length(); a++) {
                JSONObject vo = vs.optJSONObject(a);
                JSONArray rows = vo == null ? null : vo.optJSONArray("rows");
                if (rows != null) for (int i = 0; i < rows.length(); i++) {
                  JSONObject r = rows.optJSONObject(i);
                  long left = (r == null ? 0 : r.optLong("e")) - now;
                  if (left <= 0) continue;
                  next = Math.min(next, now + (left >= 86400000L ? left % 3600000L : left % 60000L) + 500);
                }
              }
              am.set(AlarmManager.RTC, next, pi);
            }
          }
          EOF
          cat > $J/WidgetConfig.java <<'EOF'
          package com.dark.constructores;
          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.Intent;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          import org.json.JSONArray;
          import org.json.JSONObject;
          // Opens when the widget is added and from the launcher's "Edit" (long-press): pick this widget's village and theme
          public class WidgetConfig extends Activity {
            int wid; String th, vil; boolean es, ic; Intent res; LinearLayout l; int pad;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              wid = getIntent().getIntExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, AppWidgetManager.INVALID_APPWIDGET_ID);
              res = new Intent().putExtra(AppWidgetManager.EXTRA_APPWIDGET_ID, wid);
              setResult(RESULT_CANCELED, res);
              es = Widget.es(this);
              th = Widget.theme(this, wid);
              vil = Widget.village(this, wid);
              ic = Widget.icons(this, wid);
              if (vil.isEmpty()) vil = Widget.data(this).optString("cur");
              pad = (int) (20 * getResources().getDisplayMetrics().density);
              l = new LinearLayout(this);
              l.setOrientation(LinearLayout.VERTICAL);
              l.setPadding(pad, pad, pad, pad / 2);
              setContentView(l);
              build();
            }
            TextView label(String s, float size) {
              TextView t = new TextView(this);
              t.setText(s); t.setTextSize(size);
              t.setPadding(0, pad / 2, 0, pad / 4);
              l.addView(t);
              return t;
            }
            void build() {
              l.removeAllViews();
              label("Widget", 20);
              JSONArray vs = Widget.data(this).optJSONArray("v");
              if (vs != null && vs.length() > 1) {
                label(es ? "Aldea" : "Village", 14);
                for (int i = 0; i < vs.length(); i++) {
                  JSONObject o = vs.optJSONObject(i);
                  if (o == null) continue;
                  final String key = o.optString("k");
                  Button bt = new Button(this);
                  bt.setAllCaps(false);
                  bt.setText((key.equals(vil) ? "✓  " : "") + o.optString("name", key));
                  bt.setOnClickListener(x -> { vil = key; build(); });
                  l.addView(bt);
                }
              }
              label(es ? "Tema" : "Theme", 14);
              String[][] opts = {{"classic", es ? "Clásico" : "Classic"}, {"oled", "OLED"}, {"light", es ? "Claro" : "Light"}};
              for (String[] o : opts) {
                Button bt = new Button(this);
                bt.setAllCaps(false);
                bt.setText((o[0].equals(th) ? "✓  " : "") + o[1]);
                bt.setOnClickListener(x -> { th = o[0]; build(); });
                l.addView(bt);
              }
              label(es ? "Íconos" : "Icons", 14);
              Button bi = new Button(this);
              bi.setAllCaps(false);
              bi.setText(ic ? (es ? "✓  Con íconos" : "✓  With icons") : (es ? "Sin íconos (minimalista)" : "No icons (minimal)"));
              bi.setOnClickListener(x -> { ic = !ic; build(); });
              l.addView(bi);
              Button ok = new Button(this);
