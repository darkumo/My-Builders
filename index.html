<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mis constructores</title>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{--brown:#6b4a2f;--brown2:#5a3d26;--edge:#3b2716;--green:#7cc83a;--green2:#4f9a1e;--gold:#ffcf3f;--txt:#fff7e6}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Nunito,system-ui,sans-serif;color:var(--txt);
 background:linear-gradient(180deg,#8fb8e0 0%,#bcd6ea 45%,#6f8f5a 100%);padding:16px 12px 40px}
.wrap{max-width:520px;margin:0 auto}
.card{background:linear-gradient(180deg,var(--brown),var(--brown2));border:3px solid var(--edge);border-radius:26px;
 padding:14px 12px 12px;box-shadow:0 6px 0 var(--edge),0 10px 24px rgba(0,0,0,.35);margin-bottom:18px}
.f{font-family:'Lilita One',Nunito,sans-serif;letter-spacing:.3px;text-shadow:0 2px 0 rgba(0,0,0,.45)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 4px 10px}
.title{font-size:26px}.title small{font-size:17px;color:var(--gold);margin-left:4px}
.btn{font-family:'Lilita One',sans-serif;font-size:17px;border:2px solid #7a5200;border-radius:14px;padding:6px 14px;cursor:pointer;
 background:linear-gradient(180deg,#ffe07a,#f5b623);color:#5a3a00;box-shadow:0 3px 0 #7a5200}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 #7a5200}
.btn.g{background:linear-gradient(180deg,#a5e35d,#5fae25);border-color:#2f6510;color:#fff;box-shadow:0 3px 0 #2f6510;text-shadow:0 1px 0 rgba(0,0,0,.4)}
.btn.d{background:#2b1c10;border-color:#1a0f07;color:var(--txt);box-shadow:0 3px 0 #1a0f07}
.sec{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:10px 4px 8px;flex-wrap:wrap}
.sec .lbl{font-size:18px;color:var(--gold)}
.pot{display:flex;align-items:center;gap:4px;background:#2b1c10;border:2px solid #c08a2a;border-radius:14px;padding:3px 6px}
.pot span{font-family:'Lilita One';font-size:15px;min-width:52px;text-align:center}
.pot button{width:28px;height:26px;border-radius:8px;border:none;background:#4a311c;color:var(--txt);font-size:18px;font-weight:800;cursor:pointer}
.pot.on{border-color:var(--gold);box-shadow:0 0 8px rgba(255,207,63,.6)}
.row{position:relative;display:flex;align-items:center;gap:8px;height:46px;border-radius:13px;background:#2a1b0f;
 border:2px solid #1c120a;margin-bottom:7px;overflow:hidden}
.fill{position:absolute;inset:0 auto 0 0;background:linear-gradient(180deg,#9be04f,var(--green) 50%,var(--green2));transition:width 1s linear}
.row.done .fill{background:linear-gradient(180deg,#ffe07a,#f5b623)}
.ic{position:relative;width:34px;height:34px;margin-left:6px;border-radius:9px;background:rgba(0,0,0,.3);display:grid;place-items:center;font-size:19px;flex:none}
.nm{position:relative;flex:1;min-width:0;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm b{color:#fff3c4;font-size:14px;margin-left:3px}
.tm{position:relative;font-family:'Lilita One';font-size:17px;margin-right:10px;text-shadow:0 2px 0 rgba(0,0,0,.6);white-space:nowrap}
.tm.boost{color:#fff36b}
.empty{text-align:center;opacity:.8;padding:10px;font-size:14px}
.free{display:inline-block;background:#2b1c10;border-radius:10px;padding:2px 10px;font-size:14px;margin-left:4px}
textarea{width:100%;height:110px;border-radius:14px;border:2px solid var(--edge);background:#2b1c10;color:var(--txt);padding:10px;font:13px monospace;resize:vertical}
.help{font-size:14px;line-height:1.45;opacity:.95;margin:6px 4px 10px}
.help b{color:var(--gold)}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.err{color:#ffb0a0;font-size:14px;margin-top:8px;min-height:1em}
.meta{font-size:12px;opacity:.75;text-align:center;margin-top:6px}
.hide{display:none}
.sumrow{display:flex;gap:6px;margin:0 2px 8px}
.sc{flex:1;background:#2b1c10;border:2px solid #1a0f07;border-radius:12px;padding:6px 8px;min-width:0}
.st{font-size:11.5px;opacity:.8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sv{font-size:17px;color:#b8f07a;white-space:nowrap}
.gob{font-family:Nunito,sans-serif;font-size:11px;font-weight:800;border:1.5px solid #fff;border-radius:7px;padding:0 5px;vertical-align:2px;opacity:.9}
.pbtn{width:100%;margin-top:10px;font-size:16px}
.prog{margin-top:10px;background:#3e2a19;border:2px solid #2a1a0e;border-radius:16px;padding:10px}
.prog h3{margin:2px 2px 8px;font-size:19px;color:var(--gold)}
.cat{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;text-align:left;background:#2b1c10;border:2px solid #1a0f07;
 border-radius:12px;padding:8px 10px;margin-bottom:6px;color:var(--txt);font:800 15px Nunito,sans-serif;cursor:pointer}
.cat .d{font-family:'Lilita One';font-size:17px;color:#fff3c4;white-space:nowrap}
.cat small{opacity:.75;font-weight:600}
.items{margin:-2px 0 8px 8px;font-size:13.5px}
.items div{display:flex;justify-content:space-between;gap:8px;padding:3px 6px;border-bottom:1px dashed rgba(255,255,255,.12)}
.items div span:last-child{white-space:nowrap;opacity:.9}
.tot{background:linear-gradient(180deg,#a5e35d,#5fae25);color:#fff;border-radius:12px;padding:9px 12px;margin:8px 0 6px;text-shadow:0 1px 0 rgba(0,0,0,.35)}
.tot .big{font-family:'Lilita One';font-size:22px}
.real{font-size:13.5px;line-height:1.5;margin:4px 2px}
.hj{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:0 2px 10px;font-size:14px}
.hj button{border:2px solid #1a0f07;border-radius:10px;background:#2b1c10;color:var(--txt);font:800 14px Nunito,sans-serif;padding:3px 10px;cursor:pointer}
.hj button.on{background:linear-gradient(180deg,#ffe07a,#f5b623);color:#5a3a00;border-color:#7a5200}
.note{font-size:12px;opacity:.7;margin:6px 2px 0}
.helper{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-2px 4px 8px;font-size:14px}
.helper .hb{display:flex;align-items:center;gap:5px;background:#2b1c10;border:2px solid #6a4a2a;border-radius:12px;padding:3px 8px}
.helper.on .hb{border-color:#7fd3ff;box-shadow:0 0 8px rgba(127,211,255,.5)}
.helper select{background:#4a311c;color:var(--txt);border:none;border-radius:8px;font:800 14px Nunito,sans-serif;padding:2px 4px}
.helper button{border:none;border-radius:8px;background:#4a311c;color:var(--txt);font:800 14px Nunito,sans-serif;padding:3px 9px;cursor:pointer}
.helper button.go{background:linear-gradient(180deg,#9fdcff,#3d9be0);color:#08304f}
.row.pick{outline:2px dashed #7fd3ff;outline-offset:-2px;cursor:pointer}
.row.helped .ic{box-shadow:0 0 0 2px #7fd3ff}
.hint{font-size:13px;color:#bfe8ff;margin:0 4px 6px}
.lang{border:1px solid rgba(255,255,255,.5);background:transparent;color:#fff;border-radius:8px;padding:1px 7px;margin-left:4px;font:800 12px Nunito,sans-serif;cursor:pointer}
.lang.on{background:#fff;color:#5a3a00}
.ver{line-height:2;text-align:center;font-size:12px;color:#fff;opacity:.7;margin-top:4px;text-shadow:0 1px 2px rgba(0,0,0,.5)}
.tab.all.on{background:linear-gradient(180deg,#a5e35d,#5fae25);border-color:#2f6510;color:#fff}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 2px 12px;padding-bottom:2px}
.tab{font-family:'Lilita One',sans-serif;font-size:15px;white-space:nowrap;border-radius:12px;padding:5px 12px;cursor:pointer;
 border:2px solid #1a0f07;background:#2b1c10;color:var(--txt)}
.tab.on{background:linear-gradient(180deg,#ffe07a,#f5b623);color:#5a3a00;border-color:#7a5200}
.tab.add{background:#4a311c}
.tab.del{background:#7a2a1a;border-color:#4a160c}

/* ===== minimal themes ===== */
body.min{background:var(--bg);color:var(--tx)}
body.min *{text-shadow:none!important;box-shadow:none!important}
body.min .f{font-family:Nunito,system-ui,sans-serif;font-weight:800;letter-spacing:0}
body.min .card{background:var(--card);border:1px solid var(--ln);border-radius:20px}
body.min .row{background:var(--track);border:1px solid var(--ln);border-radius:12px}
body.min .fill{background:var(--acc)!important;opacity:.28}
body.min .row.done .fill{background:var(--ok)!important;opacity:.35}
body.min .nm,body.min .tm{color:var(--tx)}
body.min .nm b{color:var(--mut)}
body.min .tm.boost{color:var(--acc)}
body.min .ic{background:transparent}
body.min .title small,body.min .sec .lbl,body.min .prog h3{color:var(--mut)}
body.min .btn,body.min .btn.d,body.min .btn.g{background:var(--chip);color:var(--tx);border:1px solid var(--ln)}
body.min .btn.g{background:var(--acc);color:var(--onacc);border-color:var(--acc)}
body.min .tab{background:var(--chip);color:var(--tx);border:1px solid var(--ln)}
body.min .tab.on,body.min .tab.all.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
body.min .tab.del{background:transparent;color:#e5484d;border-color:#e5484d}
body.min .pot,body.min .helper .hb,body.min .sc,body.min .cat,body.min .free,body.min .hj button{background:var(--chip);border:1px solid var(--ln);color:var(--tx)}
body.min .pot.on,body.min .helper.on .hb{border-color:var(--acc)}
body.min .pot button,body.min .helper button,body.min .helper select{background:var(--track);color:var(--tx)}
body.min .helper button.go{background:var(--acc);color:var(--onacc)}
body.min .sv{color:var(--acc)}
body.min .prog{background:transparent;border:1px solid var(--ln)}
body.min .cat .d{color:var(--tx)}
body.min .tot{background:var(--acc);color:var(--onacc)}
body.min .hj button.on{background:var(--tx);color:var(--bg);border-color:var(--tx)}
body.min textarea{background:var(--track);color:var(--tx);border:1px solid var(--ln)}
body.min .help b{color:var(--acc)}
body.min .ver,body.min .meta{color:var(--mut);opacity:1}
body.min .lang{border-color:var(--ln);color:var(--tx)}
body.min .lang.on{background:var(--tx);color:var(--bg)}
body.min .row.pick{outline-color:var(--acc)}
body.min .row.helped .ic{box-shadow:0 0 0 2px var(--acc)!important;border-radius:9px}
body.min .hint{color:var(--acc)}
body.min .gob{border-color:var(--tx)}
body.min .tm,body.min .cat .d,body.min .sv,body.min .tot .big,body.min .pot span,body.min .btn,body.min .tab{font-family:Nunito,system-ui,sans-serif;font-weight:800;font-variant-numeric:tabular-nums}
body.oled{--bg:#000;--card:#000;--track:#0d0d0d;--chip:#111;--ln:#262626;--tx:#f2f2f2;--mut:#8a8a8a;--acc:#4ade80;--onacc:#000;--ok:#facc15}
body.light{--bg:#f4f4f2;--card:#fff;--track:#f1f1ef;--chip:#fff;--ln:#e2e2de;--tx:#161616;--mut:#6b6b6b;--acc:#16a34a;--onacc:#fff;--ok:#eab308}
body.light .fill{opacity:.22}
.upd{display:flex;align-items:center;gap:6px;max-width:520px;margin:0 auto 12px;background:rgba(43,28,16,.88);border:2px solid #c08a2a;border-radius:16px;padding:4px 4px 4px 12px;color:var(--txt);animation:updIn .35s ease}
.upd .ul{flex:1;min-width:0;text-align:left;background:none;border:none;color:inherit;font:800 14px Nunito,sans-serif;padding:7px 0;cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.upd .ux{flex:none;background:none;border:none;color:inherit;opacity:.7;font:600 12.5px Nunito,sans-serif;padding:7px 8px;cursor:pointer;white-space:nowrap}
body.min .upd{background:var(--chip);border:1px solid var(--acc)}
@keyframes updIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
.abo{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.5);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.abo.hide{display:none}
.abx{width:100%;max-width:480px;background:linear-gradient(180deg,var(--brown),var(--brown2));border:3px solid var(--edge);border-radius:26px;padding:20px 16px 14px;color:var(--txt);animation:updIn .25s ease}
.abr{display:flex;justify-content:space-between;background:rgba(0,0,0,.25);border-radius:12px;padding:10px 14px;margin-top:8px;font-size:15px}
.abb{display:block;width:100%;margin-top:10px}
body.min .abx{background:var(--card);border:1px solid var(--ln);color:var(--tx)}
body.min .abr{background:var(--track)}
</style>
</head>

 out+=`<div class="real">${L('Trabajando sin parar y sin boosts:','Working nonstop, no boosts:')}<br>• ${nb} ${L('constructores','builders')}: ≈ <b>${fmtDays(bDays)}</b><br>• ${L('Laboratorio','Laboratory')}: ≈ <b>${fmtDays(lDays)}</b>${pDays?`<br>• ${L('Casa de mascotas','Pet House')}: ≈ <b>${fmtDays(pDays)}</b>`:''}<br>→ ${L('Terminarías en','You would finish in')} ≈ <b>${fmtDays(fin)}</b></div>
 <div class="note">${L('Tiempos del juego a noviembre de 2026. No incluye equipo de héroes (usa mineral, no tiempo) ni supercargas.','Game times as of November 2026. Excludes hero equipment (uses ore, not time) and supercharges.')}</div></div>`;
 return out;
}
function thOf(k){try{return parse(all.v[k].raw).th||0}catch(e){return 0}}
function show(which){$('cards').classList.toggle('hide',which!=='cards');$('paste').classList.toggle('hide',which!=='paste')}
function render(){
 renderTabs();
 const keys=Object.keys(all.v);
 if(!keys.length){show('paste');$('cancel').classList.add('hide');return}
 if(keys.length<2)all.view='one';
 show('cards');
 const list=all.view==='all'?keys.slice().sort((a,b)=>thOf(b)-thOf(a)):[all.cur];
 $('cards').innerHTML=updTab()+list.map(k=>villageCard(k,all.v[k])).join('');
}
function villageCard(k,st){
 const v=parse(st.raw),now=Date.now()/1000;
 let html=`<div class="card"><div class="top"><div class="title f">${v.tag?esc(v.tag):esc(k)} <small>${v.th?'TH'+v.th:''}</small></div>
  <button class="btn" data-sync="1">⟳ Sync</button></div>%%SUM%%`;
 const sum={};
 for(const [g,lES,lEN] of GROUPS){const label=L(lES,lEN);
  const list=v.items.filter(i=>i.group===g);
  if(!list.length&&g!=='b')continue;
  const pot=st.potions[g],f=POT[g]?POT[g].f:1;
  const potW=pot?{s:pot.s,e:pot.e,m:f}:null;
  const sn=st.potions[g+'s'],snW=sn&&POT[g+'s']?{s:sn.s,e:sn.e,m:POT[g+'s'].f}:null;
  const hs=(st.helpers||{})[g],hl=helperLvl(v,st,g);
  const rows=list.map(it=>{const hw=hs&&hs.key===it.key&&hs.e?{s:hs.s,e:hs.e,m:1+hl}:null;
   const wins=[potW,hw,snW];let rec=false;
   if(v.hrec[g]===it.key){rec=true;const st0=v.t0+(v.hcdG[g]||0);
    for(let n=0;n<60;n++){const s=st0+n*82800;wins.push({s,e:s+3600,m:1+hl})}}
   const c=calc(it,v.t0,wins,now);
   const inRec=rec&&wins.slice(3).some(w=>now>=w.s&&now<w.e);
   return{it,c,rec,helped:(!!hw&&hs.e>now)||inRec}}).sort((a,b)=>a.c.end-b.c.end);
  let head=label;const reg=list.filter(i=>!i.gob).length,hasGob=list.some(i=>i.gob);
  if(g==='b'&&v.huts)head+=` ${reg}/${v.huts}${hasGob?' + Goblin':''}`;
  html+=`<div class="sec"><div class="lbl f">${head}${g==='b'&&v.huts&&reg<v.huts?`<span class="free">${v.huts-reg} ${L('libre(s)','free')}</span>`:''}</div><div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end">${potCtl(g,k,st)}${potCtl(g+'s',k,st)}</div></div>`;
  const regEnds=rows.filter(r=>!r.it.gob).map(r=>r.c.end);
  if(g==='b')sum.b=(v.huts&&reg<v.huts)?now:(regEnds.length?Math.min(...regEnds):now);
  if(g==='l')sum.l=regEnds.length?Math.max(...regEnds):now;
  if(g==='p')sum.p=regEnds.length?Math.max(...regEnds):now;
  html+=helperBar(k,v,st,g,list);
  if(!list.length){html+=`<div class="empty">${L('Ninguna mejora activa','No active upgrades')}</div>`;continue}
  const picking=pickFor&&pickFor.k===k&&pickFor.g===g;
  for(const {it,c,helped,rec} of rows){
   const name=N(it.id);
   // full duration: game data (with Hammer Jam if on); if first seen right after starting, trust the real timer
   let tot=(totalFor(it.id,it.lvl)||0)*((all.hj&&all.hj.on)?1-all.hj.pct/100:1)||it.timer;
   const S=st.seen&&st.seen[it.key];
   if(S&&(S.fresh||S.F>=tot*0.75))tot=S.F;
   if(it.timer>tot)tot=it.timer;
   const done=c.end<=now;
   const pct=done?100:Math.min(100,Math.max(2,(1-c.rem/tot)*100));
   html+=`<div class="row ${done?'done':''} ${picking&&!done?'pick':''} ${helped?'helped':''}" data-k="${esc(k)}" data-g="${g}" data-item="${it.key}"><div class="fill" style="width:${pct}%"></div>
    <div class="ic">${helped?'🧑‍🔧':(ICON[it.k]||'🔨')}</div>
    <div class="nm f">${it.gob?'<span class="gob">GOBLIN</span> ':''}${rec?'🔁 ':''}${esc(name)}${it.cnt>1?' ×'+it.cnt:''} <b>→ ${it.lvl+1}</b></div>
    <div class="tm ${c.boost?'boost':''}">${done?L('¡Listo!','Done!'):'⏱ '+fmt(c.end-now)}</div></div>`;
  }
 }
 const po=openProg.has(k);
 html+=`<button class="btn d pbtn" data-prog="${esc(k)}">📊 ${po?L('Ocultar progreso','Hide progress'):L('Ver lo que falta para TH','See what is left for TH')+(v.th||'')}</button>`;
 if(po)html+=progPanel(k,v);
 if(sum.l===undefined)sum.l=now;
 const chip=(ic,t,end)=>`<div class="sc"><div class="st">${ic} ${t}</div><div class="sv f">${end<=now?L('¡Libre!','Free!'):fmt(end-now)}</div></div>`;
 html=html.replace('%%SUM%%',`<div class="sumrow">${chip('🔨',L('Constructor libre','Next builder'),sum.b)}${chip('🧪',L('Laboratorio','Lab'),sum.l)}${sum.p!==undefined?chip('🐾',L('Mascotas','Pets'),sum.p):''}</div>`);
 return html+`<div class="meta">${L('Exportado','Exported')}: ${new Date(v.t0*1000).toLocaleString(L('es','en'))}</div></div>`;
}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

$('tabs').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 if(b.dataset.v){all.cur=b.dataset.v;all.view='one';state=all.v[all.cur];delArm=false;save();render();return}
 if(b.dataset.act==='all'){all.view='all';delArm=false;save();render();return}
 if(b.dataset.act==='add'){delArm=false;renderTabs();adding=true;if(tryClip())return;
  show('paste');$('cancel').classList.toggle('hide',!state);$('ta').focus();return}
 if(b.dataset.act==='del'){
  if(!delArm){delArm=true;renderTabs();setTimeout(()=>{delArm=false;renderTabs()},4000);return}
  delete all.v[all.cur];delArm=false;const ks=Object.keys(all.v);all.cur=ks[0]||null;state=all.cur?all.v[all.cur]:null;save();render();}
});
let adding=false;
// inside the Android app: read the clipboard directly so Sync is one tap
let upd=null;
try{if(all.upd&&AB&&all.upd.build>(+AB.buildNumber()||0))upd=all.upd}catch(e){}
function checkUpdates(){try{const r=AB&&AB.repo&&AB.repo();if(r){AB.checkUpdate('https://api.github.com/repos/'+r+'/releases/latest');return true}}catch(e){}return false}
window.onUpdateInfo=function(s){let r=null;try{r=JSON.parse(s)}catch(e){}
 const box=$('updMsg');
 if(!r||!r.tag_name){if(box)box.textContent=L('No se pudo revisar. ¿Tienes internet?',"Couldn't check. Are you online?");return}
 const build=parseInt(String(r.tag_name).replace(/\D/g,''))||0,cur=+(AB.buildNumber())||0;
 const apk=(r.assets||[]).find(a=>/\.apk$/i.test(a.name)),vm=String(r.name||'').match(/v\d+(\.\d+)*/);
 upd=(build>cur&&apk)?{ver:vm?vm[0]:'build '+build,url:apk.browser_download_url,build}:null;
 all.upd=upd;all.lastUpd=Date.now();save();
 if(box)box.textContent=upd?L('Nueva versión: ','New version: ')+upd.ver:L('Ya tienes la última versión','You have the latest version');
 render();
};
function updTab(){if(!upd||all.hideUpd===upd.build)return'';
 return `<div class="upd"><button class="ul" data-upd="get">⬇ ${L('Nueva versión','New version')} ${esc(upd.ver)} · <u>${L('Descargar','Download')}</u></button><button class="ux" data-upd="hide">${L('No volver a mostrar',"Don't show again")}</button></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('[data-upd]');if(!b)return;
 if(b.dataset.upd==='get'&&upd){try{AB.openUrl(upd.url)}catch(x){}}
 if(b.dataset.upd==='hide'&&upd){all.hideUpd=upd.build;save();render()}
 if(b.dataset.upd==='check'){const m=$('updMsg');if(m)m.textContent=L('Buscando…','Checking…');checkUpdates()}
 if(b.dataset.upd==='repo'){try{AB.openUrl('https://github.com/'+AB.repo())}catch(x){}}});
window.onAndroidBack=function(){if(!$('about').classList.contains('hide')){closeAbout();return true}if(!$('paste').classList.contains('hide')&&Object.keys(all.v).length){adding=false;render();return true}return false};
window.onAndroidResume=function(){if(Date.now()-(all.lastUpd||0)>6*36e5)setTimeout(checkUpdates,1500)};
function openAbout(){const a=$('about');
 a.innerHTML=`<div class="abx"><div style="text-align:center"><svg width="76" height="76" viewBox="0 0 48 48" style="border-radius:18px"><rect width="48" height="48" rx="11" fill="#5A3D26"/><g transform="rotate(40 22 22)"><rect x="20.5" y="13" width="3" height="24" rx="1.5" fill="#C8955A"/><rect x="13" y="8" width="18" height="7.5" rx="2" fill="#D9DDE3"/><rect x="13" y="8" width="3.2" height="7.5" rx="1.2" fill="#AEB4BD"/><rect x="27.8" y="8" width="3.2" height="7.5" rx="1.2" fill="#AEB4BD"/></g><circle cx="34.5" cy="34.5" r="8" fill="#FFCF3F" stroke="#5A3D26" stroke-width="1.2"/><path d="M33.7 30h1.6v4.3l2.9 1.7-.8 1.4-3.7-2.1z" fill="#3B2716"/></svg><div class="f" style="font-size:26px;margin-top:10px">My Builders</div><div style="opacity:.8">${L('Versión','Version')} ${APP_VERSION}</div></div>
 <div class="abr"><span>${L('Creado por','Made by')}</span><b>darkumo</b></div><div class="abr"><span>${L('Licencia','License')}</span><b>MIT</b></div>
 <div class="abr" style="font-size:12.5px;opacity:.75;display:block">${L('App de fans, no afiliada a Supercell.','Fan-made app, not affiliated with Supercell.')}</div>
 ${AB?`<div id="updMsg" style="text-align:center;font-size:14px;margin:12px 0 6px">${upd?L('Nueva versión: ','New version: ')+esc(upd.ver):''}</div>
  <button class="btn ${upd?'g':'d'} abb" data-upd="${upd?'get':'check'}">${upd?L('Descargar actualización','Download update'):L('Buscar actualizaciones','Check for updates')}</button>
  <button class="btn abb" data-upd="repo">${L('Ver en GitHub','View on GitHub')}</button>`:''}
 <button class="btn d abb" id="abClose">${L('Cerrar','Close')}</button></div>`;
 a.classList.remove('hide');$('abClose').onclick=closeAbout;a.onclick=e=>{if(e.target===a)closeAbout()}}
function closeAbout(){$('about').classList.add('hide')}
function tryClip(){try{if(window.AndroidClip){const t=AndroidClip.get();if(t&&t.trim().startsWith('{')){$('ta').value=t;$('load').click();return true}}}catch(e){}return false}
$('cards').addEventListener('change',e=>{
 const s=e.target.closest('select[data-hl]');if(!s)return;
 const st=all.v[s.dataset.k];st.helpers=st.helpers||{};
 st.helpers[s.dataset.hl]=Object.assign(st.helpers[s.dataset.hl]||{},{lvl:+s.value});save();render();
});
$('cards').addEventListener('click',e=>{
 if(e.target.closest('select'))return;
 const pb=e.target.closest('[data-prog]');if(pb){const k=pb.dataset.prog;openProg.has(k)?openProg.delete(k):openProg.add(k);render();return}
 const cb=e.target.closest('[data-cat]');if(cb){const c=cb.dataset.cat;openCat.has(c)?openCat.delete(c):openCat.add(c);render();return}
 const hjb=e.target.closest('[data-hj]');if(hjb){const x=hjb.dataset.hj;all.hj=x==='off'?{on:false,pct:(all.hj||{}).pct||50}:{on:true,pct:+x};save();render();return}
 const hb=e.target.closest('button[data-hk]');
 if(hb){const st=all.v[hb.dataset.hk],g=hb.dataset.hg,now=Date.now()/1000;st.helpers=st.helpers||{};const hs=st.helpers[g]=st.helpers[g]||{};
  if(hb.dataset.pick){pickFor=pickFor&&pickFor.k===hb.dataset.hk&&pickFor.g===g?null:{k:hb.dataset.hk,g};render();return}
  if(hb.dataset.hx){delete hs.key;delete hs.s;delete hs.e;save();render();return}
  hs.e=Math.min(hs.e+(+hb.dataset.hd)*60,now+3600);if(hs.e<=now){delete hs.key;delete hs.s;delete hs.e}
  save();render();return}
 const row=e.target.closest('.row.pick');
 if(row&&pickFor){const st=all.v[row.dataset.k],now=Date.now()/1000;st.helpers=st.helpers||{};
  st.helpers[row.dataset.g]=Object.assign(st.helpers[row.dataset.g]||{},{key:row.dataset.item,s:now,e:now+3600});
  pickFor=null;save();render();return}
 if(e.target.closest('[data-sync]')){adding=false;if(tryClip())return;show('paste');$('cancel').classList.remove('hide');$('ta').focus();return}
 const b=e.target.closest('button[data-g]');if(!b)return;
 const st=all.v[b.dataset.k];if(!st)return;
 const g=b.dataset.g,d=+b.dataset.d*60,now=Date.now()/1000;
 let p=st.potions[g];
 if(!p||p.e<=now){ if(d<0)return; p={s:now,e:now+d}; }
 else { p.e=Math.max(now,p.e+d); if(p.e<=now)p=null; }
 if(p)st.potions[g]=p;else delete st.potions[g];
 save();render();
});
function save(){if(all.cur&&state)all.v[all.cur]=state;store.set('coc_villages',all)}
$('load').onclick=()=>{
 const raw=$('ta').value.trim();$('err').textContent='';
 try{const v=parse(raw);
  // keep potions that are still running
  const keep={};const now=Date.now()/1000;
  if(state)for(const[g,p]of Object.entries(state.potions||{}))if(p.e>now)keep[g]={s:Math.max(p.s,v.t0),e:p.e};
  // the export's tag decides which village it is; Sync on a different village's export just switches/creates it
  const key=v.tag||(adding?L('Aldea ','Village ')+(Object.keys(all.v).length+1):(all.cur||'Aldea 1'));
  const prev=all.v[key];const pk={};
  if(prev)for(const[g,p]of Object.entries(prev.potions||{}))if(p.e>now)pk[g]={s:Math.max(p.s,v.t0),e:p.e};
  const hk=(prev&&prev.helpers)||{};
  for(const[g,sec]of Object.entries(v.boosts))pk[g]={s:v.t0,e:v.t0+sec};
  for(const[g,a]of Object.entries(v.hact))hk[g]=Object.assign(hk[g]||{},{key:a.key,s:v.t0,e:v.t0+a.rem});
  const seen={},ps=(prev&&prev.seen)||{};
  let prevKeys=null;try{if(prev)prevKeys=new Set(parse(prev.raw).items.map(i=>i.key))}catch(e){}
  // an upgrade that wasn't in the previous export just started: its timer now is (almost) its full duration
  for(const it of v.items)seen[it.key]=ps[it.key]||{F:it.timer,fresh:!!prevKeys&&!prevKeys.has(it.key)};
  all.cur=key;state={raw,potions:pk,helpers:hk,seen};adding=false;save();$('ta').value='';render();
 }catch(e){$('err').textContent=L('Eso no parece el export del juego. Copia de nuevo y pega todo el texto.',"That doesn't look like the game export. Copy it again and paste all the text.")}
};

 document.querySelectorAll('.lang[data-theme]').forEach(b=>b.classList.toggle('on',(all.theme||'classic')===b.dataset.theme))}

 try{AB&&AB.setBars(t==='oled'?'#000000':t==='light'?'#f4f4f2':'#8fb8e0',t!=='oled')}catch(e){}document.body.classList.toggle('min',t!=='classic');document.body.classList.toggle('oled',t==='oled');document.body.classList.toggle('light',t==='light');

if(AB){
 if(Date.now()-(all.lastUpd||0)>6*36e5)setTimeout(checkUpdates,2500)}
render();setInterval(()=>{if(state&&!$('cards').classList.contains('hide')&&!(document.activeElement&&document.activeElement.tagName==='SELECT'))render()},1000);
